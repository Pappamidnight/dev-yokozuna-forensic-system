  argumentos:
    - "Um pedido/report a E-REDES nao equivale a uma inspecao tecnica"
    - "A decisao de 3719 nao indiciou o risco de incendio"
    - "A origem da energia ficou desconhecida"
    - "Nao ha relatorio tecnico nem identificacao de autoria"
  contra_argumentos_esperados:
    - "A Autora pode alegar que submeteu o pedido por seguranca"
    - "A E-REDES pode ter confirmado por email (verificar)"
  prova_a_pedir:
    - "Relatorio tecnico E-REDES completo"
    - "Registo da inspecao no local"
    - "Email de resposta da E-REDES a Autora"
