notas: |
  Doc. 9 prova que alguem submeteu um pedido a E-REDES.
  NAO prova:
    - existencia real de ligacao clandestina
    - origem da energia
    - autoria (nao imputavel a Nuno sem relatorio tecnico)
    - risco concreto de incendio
  
  Em 3719, o tribunal nao deu por indiciado o risco de incendio.
  Falta: relatorio tecnico E-REDES + inspecao + fotografias originais.

# ============================================================
# O QUE FALTA PARA SUSTENTAR A ALEGACAO
# ============================================================
lacunas:
  - Relatorio tecnico E-REDES com identificacao da instalacao
  - Inspecao no local (data, participantes, resultado)
  - Fotografias originais com metadados (data, GPS)
  - Identificacao da autoria (quem fez a ligacao)
  - Prova de nexo causal entre ligacao e risco de incendio

# ============================================================
# ESTRATEGIA DE REFUTACAO
# ============================================================
refutacao:
